<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжная пятница · подборка</title>
    <!-- подключаем шрифты: Poppins (заголовок-рубрика), Lora (основные заголовки, список), Inter (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Lora:wght@600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        /* базовый сброс и контейнер */
        .book-block * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .book-block {
            max-width: 640px;      /* комфортная ширина для чтения */
            margin: 0 auto;
            background: #FFFFFF;
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            padding: 20px 24px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
        }
        /* рубрика (тип title, но маленький) */
        .rubric {
            font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #E86A6A;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        /* главный заголовок */
        .main-title {
            font-family: 'Lora', 'Georgia', serif;
            font-size: 36px;
            font-weight: 600;
            color: #2D3047;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        /* описание */
        .desc-text {
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            color: #5A5D7A;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        /* изображение */
        .book-image {
            display: block;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 24px;
            object-fit: cover;
        }
        /* список книг */
        .book-list {
            margin-bottom: 24px;
        }
        .book-item {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #EFEFF5;
        }
        .book-item:last-child {
            border-bottom: none;
        }
        .book-info {
            display: flex;
            gap: 16px;
            align-items: baseline;
            font-family: 'Lora', 'Georgia', serif;
            font-size: 18px;
            color: #2D3047;
        }
        .book-number {
            font-weight: 600;
            color: #C7C7D4;       /* приглушённый серый для номера */
            min-width: 32px;
        }
        .book-title {
            font-weight: 600;
        }
        .book-author {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #5A5D7A;
            margin-left: 4px;
            font-weight: 400;
        }
        .book-price {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #E86A6A;        /* priceColor */
            white-space: nowrap;
            margin-left: 16px;
        }
        /* кнопка */
        .book-button {
            display: inline-block;
            background-color: #2D3047;
            color: #FFFFFF;
            font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            transition: background 0.15s;
            text-align: left;
        }
        .book-button:hover {
            background-color: #1f2136;
        }
        .align-left {
            text-align: left;
        }
        /* утилиты */
        .mb-8 { margin-bottom: 8px; }
    </style>
</head>
<body style="margin:0; background:#f5f2f0; padding:30px 16px; display:flex; justify-content:center;">
    <!-- основной блок, в точности по шаблону template2 -->
    <div class="book-block" style="background:#FFFFFF; border-radius:24px; padding:20px 24px;">

        <!-- 1. rubric title (Пятница) -->
        <div class="rubric" style="font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; color:#E86A6A; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;">
            📚 Книжная пятница
        </div>

        <!-- 2. большой заголовок -->
        <div class="main-title" style="font-family:'Lora',serif; font-size:36px; font-weight:600; color:#2D3047; line-height:1.3; margin-bottom:16px;">
            3 книги, которые изменят ваше мышление
        </div>

        <!-- 3. текст-описание -->
        <div class="desc-text" style="font-family:'Inter',sans-serif; font-size:16px; color:#5A5D7A; line-height:1.5; margin-bottom:24px;">
            Подборка от наших редакторов — только самые вдохновляющие истории и полезные практики.
        </div>

        <!-- 4. изображение (книги) -->
        <img class="book-image" src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800&auto=format&fit=crop" alt="Книги" style="display:block; width:100%; border-radius:12px; margin-bottom:24px;">

        <!-- 5. кастомный список книг (list) с number, title, author, price -->
        <div class="book-list" style="margin-bottom:24px;">
            <!-- книга 01 -->
            <div class="book-item" style="display:flex; align-items:baseline; justify-content:space-between; padding:12px 0; border-bottom:1px solid #EFEFF5;">
                <div class="book-info" style="display:flex; gap:16px; align-items:baseline; font-family:'Lora',serif; font-size:18px; color:#2D3047;">
                    <span class="book-number" style="font-weight:600; color:#C7C7D4; min-width:32px;">01</span>
                    <span class="book-title" style="font-weight:600;">Думай медленно... решай быстро</span>
                    <span class="book-author" style="font-family:'Inter',sans-serif; font-size:15px; color:#5A5D7A; font-weight:400;">Даниэль Канеман</span>
                </div>
                <span class="book-price" style="font-family:'Inter',sans-serif; font-size:18px; font-weight:500; color:#E86A6A; white-space:nowrap;">890 ₽</span>
            </div>
            <!-- книга 02 -->
            <div class="book-item" style="display:flex; align-items:baseline; justify-content:space-between; padding:12px 0; border-bottom:1px solid #EFEFF5;">
                <div class="book-info" style="display:flex; gap:16px; align-items:baseline; font-family:'Lora',serif; font-size:18px; color:#2D3047;">
                    <span class="book-number" style="font-weight:600; color:#C7C7D4; min-width:32px;">02</span>
                    <span class="book-title" style="font-weight:600;">Атомные привычки</span>
                    <span class="book-author" style="font-family:'Inter',sans-serif; font-size:15px; color:#5A5D7A; font-weight:400;">Джеймс Клир</span>
                </div>
                <span class="book-price" style="font-family:'Inter',sans-serif; font-size:18px; font-weight:500; color:#E86A6A;">750 ₽</span>
            </div>
            <!-- книга 03 -->
            <div class="book-item" style="display:flex; align-items:baseline; justify-content:space-between; padding:12px 0; border-bottom:none;">
                <div class="book-info" style="display:flex; gap:16px; align-items:baseline; font-family:'Lora',serif; font-size:18px; color:#2D3047;">
                    <span class="book-number" style="font-weight:600; color:#C7C7D4; min-width:32px;">03</span>
                    <span class="book-title" style="font-weight:600;">Поток</span>
                    <span class="book-author" style="font-family:'Inter',sans-serif; font-size:15px; color:#5A5D7A; font-weight:400;">Михай Чиксентмихайи</span>
                </div>
                <span class="book-price" style="font-family:'Inter',sans-serif; font-size:18px; font-weight:500; color:#E86A6A;">920 ₽</span>
            </div>
        </div>

        <!-- 6. кнопка (выравнивание влево, как в шаблоне) -->
        <div class="align-left" style="text-align:left;">
            <a href="#" class="book-button" style="display:inline-block; background-color:#2D3047; color:#FFFFFF; font-family:'Poppins',sans-serif; font-size:16px; font-weight:500; padding:14px 32px; border-radius:8px; text-decoration:none; border:none;">
                Посмотреть все книги
            </a>
        </div>
        <!-- маленький отступ снизу для эстетики (не в шаблоне, но не мешает) -->
        <div style="height:4px;"></div>
    </div>
</body>
</html>
